<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SAJ Construction</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">SAJ Construction</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="cost-guide.html">Cost Guide</a></li>
                <li><a href="articles.html">Articles</a></li>
                <li><a href="contact.html" class="cta active">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-section">
            <h1>Contact Us</h1>
            <form class="contact-form" id="contactForm" novalidate>
                <div class="form-group">
                    <label for="name">Name*</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone*</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="projectType">Project Type*</label>
                    <select id="projectType" name="projectType" required>
                        <option value="">Select a type</option>
                        <option>Building</option>
                        <option>Renovations</option>
                        <option>Roofing</option>
                        <option>Painting</option>
                        <option>Plumbing</option>
                        <option>Electrical</option>
                        <option>Tiling</option>
                        <option>Aluminium/Glass</option>
                        <option>Machinery</option>
                        <option>Heavy Machinery</option>
                        <option>Welding</option>
                        <option>Power Tools</option>
                        <option>Flooring</option>
                        <option>Road Construction</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Message*</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Submit</button>
                <div id="formMessage" class="form-message"></div>
            </form>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <div>© 2025 SAJ Construction. All rights reserved.</div>
            <div><a href="#">Terms & Conditions</a> | <a href="mailto:info@sajconstruction.co.za">info@sajconstruction.co.za</a></div>
        </div>
    </footer>
</body>
</html>
